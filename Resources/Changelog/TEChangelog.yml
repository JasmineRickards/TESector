      message: Added back PhaseNoms, The Dark, ShadeGen.
    - type: Add
      message: >-
        Phase-Barrier Cable, a new way to block nullspace movemnt, can now be
        crafted in protolathe or be bought from sec kit.
    - type: Fix
      message: Shadegen not working correctly with items in containers.
    - type: Remove
      message: The ability for Brighteyes to be Revolutionary.
    - type: Add
      message: Added ten new jazz songs from Tim Kulig, with bespoke sleeve art.
    - type: Tweak
      message: Sleeves can now hold five disks instead of one, enjoy!
    - type: Add
      message: Sixteen more new vinyl tracks!
    - type: Add
      message: Portable vinyl player, the Grooveman! Find it at Cargo.
  id: 10
