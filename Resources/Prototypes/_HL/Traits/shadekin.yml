# Shadekin-exclusive regen traits to replace platelets.
# These add a ShadekinRegenerationComponent (heals only in darkness), which stacks on top of the
# shadekin's native PassiveDamage regen. replaceComponents: true ensures the trait's values win if a
# ShadekinRegenerationComponent is ever added to the base mob.

- type: trait
  id: ShadekinRegeneration
  name: hl-trait-shadekin-regeneration-name
  description: hl-trait-shadekin-regeneration-desc
  category: Physical
  cost: 2
  replaceComponents: true
  whitelist:
    components:
    - Shadekin
# Start TE - remake trait selection UI
#  mutuallyExclusiveTraits:
#  - ExtremeShadekinRegeneration
#  - PlateletFactories
#  - NaturalRegen
#  - UnnaturalRegen
#  requirements:
#  - !type:TraitsRequirement
#    traits:
#    - LightSensitivity
#    - ExtremeLightSensitivity
  requirements:
  - !type:TraitsRequirement
    requiredTraits:
      - LightSensitivity
      - MildLightSensitivity
      - ExtremeLightSensitivity
    excludedTraits:
      - ExtremeShadekinRegeneration
      - PlateletFactories
      - NaturalRegen
      - UnnaturalRegen
# End TE - remake trait selection UI
  components:
  - type: ShadekinRegeneration
    healPerSecond: 0.18
    intervalSeconds: 1
    critMultiplier: 0.5
    healTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Shock
    - Cold
    - Asphyxiation

- type: trait
  id: ExtremeShadekinRegeneration
  name: hl-trait-extreme-shadekin-regeneration-name
  description: hl-trait-extreme-shadekin-regeneration-desc
  category: Physical
  cost: 5
  replaceComponents: true
  whitelist:
    components:
    - Shadekin
  # Start TE - remake trait selection UI
#  mutuallyExclusiveTraits:
#  - ShadekinRegeneration
#  - PlateletFactories
#  - LightSensitivity
#  - NaturalRegen
#  - UnnaturalRegen
#  requirements:
#  - !type:TraitsRequirement
#    traits:
#    - ExtremeLightSensitivity
  requirements:
  - !type:TraitsRequirement
    requiredTraits:
      - ExtremeLightSensitivity
    excludedTraits:
      - ShadekinRegeneration
      - PlateletFactories
      - LightSensitivity
      - NaturalRegen
      - UnnaturalRegen
  # End TE - remake trait selection UI

  components:
  - type: ShadekinRegeneration
    healPerSecond: 0.36
    intervalSeconds: 1
    critMultiplier: 0.5
    healTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Shock
    - Cold
    - Caustic
    - Poison
    - Radiation
    - Asphyxiation
