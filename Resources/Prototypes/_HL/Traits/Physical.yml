## Height traits

- type: trait
  id: Big
  name: big-name
  description: big-text
  category: Physical
  cost: 3
  replaceComponents: true
  # Start TE - remake trait selection UI
#  mutuallyExclusiveTraits:
#  - Small
#  - Tiny
  requirements:
  - !type:TraitsRequirement
    excludedTraits:
      - Small
      - Tiny
  # End TE - remake trait selection UI
  components:
  - type: SizeAttribute
    tall: true
  - type: TallWhitelist
    scale: 1.3
    borgScale: 1.1
    borgFixtureRadius: 0.45
    densityMultiplier: 1.25
    cosmeticOnly: false
  - type: CritThresholdModifier
    critThresholdDelta: 25
  - type: GunAccuracyModifier
    spreadMultiplier: 1.25
  - type: MeleeDamageModifier
    flatBonus: 2
    damageType: Blunt
  - type: ThrowStrengthModifier
    multiplier: 1.35
  - type: TraitZoomModifier
    multiplier: 1.15
# TE: Replaced speed penalties with health penalties.
#  - type: TraitMovementSpeedModifier
#    walkMultiplier: 0.7
#    sprintMultiplier: 0.75
  - type: TraitCyborgPowerDrawModifier
    multiplier: 3
  - type: CrawlUnderObjects
    sneakSpeedModifier: 0.55
    squeezeRadiusScale: 0.75
    unsqueezedRadiusScale: 1.05

