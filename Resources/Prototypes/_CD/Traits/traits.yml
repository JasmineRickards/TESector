- type: trait
  id: Synthetic
  name: trait-synthetic-name
  description: trait-synthetic-desc
  category: Physical
  cost: 3 # HardLight: It does actual stuff now
  # Start TE - remake trait selection UI
#  speciesBlacklist: # HardLight
#  - IPC
#  - Synth
  requirements:
  - !type:SpeciesRequirement
    inverted: true
    species:
      - IPC
      - Synth
  # End TE - remake trait selection UI
  blacklist:
    components:
      - BorgChassis
  components:
    - type: Synthetic
    # Hardlight start: Gives Trinary and EAL
    - type: LanguageSpeaker
